# 代理配置
proxy:
  enabled: true
  host: 127.0.0.1
  port: 7890

# 端口配置
server:
  port: 8086

suno:
  api:
    base-url: https://api.sunoapi.org
    key: ${SUNO_API_KEY:} # 请通过环境变量 SUNO_API_KEY 注入（已脱敏）
    timeout: 120000
    callback-url: http://localhost:8086/api/callback

spring:
  servlet:
    multipart:
      max-file-size: 50MB      # 增加文件大小限制到50MB
      max-request-size: 50MB   # 增加请求大小限制到50MB
      enabled: true
      location: ${user.dir}/uploads # 指定临时文件存储位置
  web:
    resources:
      static-locations: classpath:/static/,file:${user.dir}/uploads/

logging:
  level:
    com.team.sunoapi: DEBUG

# 阿里云 OSS 配置
aliyun:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com # 请替换为您创建Bucket时选择的实际Endpoint
    accessKeyId: ${ALIYUN_OSS_AK_ID:} # 请通过环境变量注入（已脱敏）
    accessKeySecret: ${ALIYUN_OSS_AK_SECRET:} # 请通过环境变量注入（已脱敏）
    bucketName: suno-audio # 替换成你的Bucket名称