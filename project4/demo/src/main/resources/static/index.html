<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文创风格迁移系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
    <style>
        /* 初始加载样式 */
        #app {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            position: relative;
            overflow: hidden;
        }
        
        #app::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(32, 124, 229, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(101, 78, 163, 0.1) 0%, transparent 50%);
            z-index: -1;
        }
        
        .loading-initial {
            text-align: center;
            color: #e0e0e0;
            z-index: 1;
        }
        
        .loading-initial .spinner {
            border: 4px solid rgba(64, 156, 255, 0.3);
            border-top: 4px solid #409cff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
            box-shadow: 0 0 15px rgba(64, 156, 255, 0.5);
        }
        
        .loading-initial p {
            font-size: 1.2rem;
            color: #64b5f6;
            text-shadow: 0 0 5px rgba(100, 181, 246, 0.5);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-initial">
            <div class="spinner"></div>
            <p>AI文创风格迁移系统启动中...</p>
        </div>
    </div>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
