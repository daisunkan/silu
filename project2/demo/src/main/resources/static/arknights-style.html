<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明日方舟风格演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #0a0a12;
            color: #e1e1e1;
            overflow-x: hidden;
            height: 100vh;
        }
        
        .slides-container {
            display: flex;
            height: 100vh;
            width: 300vw;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        
        .slide {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        .slide-1 {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .slide-2 {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
        }
        
        .slide-3 {
            background: linear-gradient(135deg, #0f3460 0%, #0a0a12 100%);
        }
        
        .slide-title {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, #a8c0ff, #3f2b96);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(168, 192, 255, 0.3);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }
        
        .slide.active .slide-title {
            opacity: 1;
            transform: translateY(0);
        }
        
        .slide-desc {
            font-size: 1.2rem;
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease 0.2s;
        }
        
        .slide.active .slide-desc {
            opacity: 0.9;
            transform: translateY(0);
        }
        
        .slide-image {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(168, 192, 255, 0.2);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.8s ease 0.4s;
        }
        
        .slide.active .slide-image {
            opacity: 1;
            transform: scale(1);
        }
        
        .nav-dots {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 100;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .dot.active {
            background: #a8c0ff;
            transform: scale(1.3);
            box-shadow: 0 0 10px #a8c0ff;
        }
        
        .decorative-element {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(168, 192, 255, 0.1) 0%, rgba(63, 43, 150, 0.1) 100%);
            filter: blur(50px);
            z-index: -1;
        }
        
        .element-1 {
            top: -100px;
            left: -100px;
        }
        
        .element-2 {
            bottom: -100px;
            right: -100px;
        }
        
        @media (max-width: 768px) {
            .slide-title {
                font-size: 2.5rem;
            }
            
            .slide-desc {
                font-size: 1rem;
                max-width: 90%;
            }
            
            .slide-image {
                width: 200px;
                height: 200px;
            }
            
            .nav-dots {
                right: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="slides-container">
        <div class="slide slide-1 active">
            <div class="decorative-element element-1"></div>
            <div class="decorative-element element-2"></div>
            <div class="slide-image">
                <svg width="150" height="150" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 7L12 12L21 7L12 2Z" stroke="#a8c0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 12L12 17L21 12" stroke="#a8c0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 17L12 22L21 17" stroke="#a8c0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1 class="slide-title">明日方舟风格</h1>
            <p class="slide-desc">横向翻页式网页设计，灵感来源于明日方舟官网</p>
        </div>
        <div class="slide slide-2">
            <div class="decorative-element element-1"></div>
            <div class="decorative-element element-2"></div>
            <div class="slide-image">
                <svg width="150" height="150" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#a8c0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 8V16" stroke="#a8c0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M8 12H16" stroke="#a8c0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1 class="slide-title">高级感设计</h1>
            <p class="slide-desc">深色背景与蓝色渐变元素，营造明日方舟特有的科技感与高级感</p>
        </div>
        <div class="slide slide-3">
            <div class="decorative-element element-1"></div>
            <div class="decorative-element element-2"></div>
            <div class="slide-image">
                <svg width="150" height="150" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2Z" stroke="#a8c0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 6V12L16 14" stroke="#a8c0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1 class="slide-title">响应式布局</h1>
            <p class="slide-desc">适配不同设备屏幕，保持一致的视觉体验</p>
        </div>
    </div>
    
    <div class="nav-dots">
        <div class="dot active" data-index="0"></div>
        <div class="dot" data-index="1"></div>
        <div class="dot" data-index="2"></div>
    </div>

    <script>
        // 横向翻页逻辑
        const slidesContainer = document.querySelector('.slides-container');
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        let currentIndex = 0;
        
        // 导航点点击事件
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                const index = parseInt(dot.getAttribute('data-index'));
                goToSlide(index);
            });
        });
        
        // 触摸和鼠标滑动事件
        let startX, moveX;
        slidesContainer.addEventListener('touchstart', handleTouchStart, { passive: true });
        slidesContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
        slidesContainer.addEventListener('mousedown', handleMouseDown);
        
        function handleTouchStart(e) {
            startX = e.touches[0].clientX;
        }
        
        function handleTouchMove(e) {
            if (!startX) return;
            moveX = e.touches[0].clientX;
            const diffX = startX - moveX;
            
            if (Math.abs(diffX) > 50) {
                e.preventDefault();
                if (diffX > 0 && currentIndex < slides.length - 1) {
                    goToSlide(currentIndex + 1);
                } else if (diffX < 0 && currentIndex > 0) {
                    goToSlide(currentIndex - 1);
                }
                startX = null;
            }
        }
        
        function handleMouseDown(e) {
            startX = e.clientX;
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }
        
        function handleMouseMove(e) {
            moveX = e.clientX;
        }
        
        function handleMouseUp() {
            if (startX && moveX) {
                const diffX = startX - moveX;
                if (Math.abs(diffX) > 50) {
                    if (diffX > 0 && currentIndex < slides.length - 1) {
                        goToSlide(currentIndex + 1);
                    } else if (diffX < 0 && currentIndex > 0) {
                        goToSlide(currentIndex - 1);
                    }
                }
            }
            startX = null;
            moveX = null;
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);
        }
        
        // 键盘左右箭头导航
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentIndex < slides.length - 1) {
                goToSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                goToSlide(currentIndex - 1);
            }
        });
        
        function goToSlide(index) {
            currentIndex = index;
            slidesContainer.style.transform = `translateX(-${currentIndex * 100}vw)`;
            
            // 更新slide激活状态
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            
            // 更新导航点激活状态
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }
    </script>
</body>
</html>
